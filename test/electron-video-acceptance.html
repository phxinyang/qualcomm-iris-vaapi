<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Electron video acceptance</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
  body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .55rem 0; }
  input, select, button { font: inherit; padding: .3rem .45rem; }
  input { width: min(34rem, 100%); }
  video { display: block; max-width: 100%; margin: 1rem 0; background: #111; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: .2rem 1rem; }
  #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  .warning { border-left: .3rem solid #e6a700; padding: .5rem .8rem; }
</style>

<h1>Iris Electron video acceptance</h1>
<p class="warning">This page measures a real HTML <code>&lt;video&gt;</code> surface. It cannot read
<code>chrome://media-internals</code> from page JavaScript: enter that decoder evidence below.
GPU/libva loading alone is not a video-decoder pass.</p>

<label>Video URL <input id="src" value="../Big_Buck_Bunny_1080p_30sec.mp4"></label>
<label>Decoder name from media-internals <input id="decoder" placeholder="VaapiVideoDecoder"></label>
<label>kIsPlatformVideoDecoder <select id="platform"><option value="true">true</option><option value="false">false</option><option value="unknown" selected>unknown</option></select></label>
<div class="grid">
  <label>Application <input id="app" placeholder="Obsidian"></label>
  <label>Application version <input id="appVersion"></label>
  <label>Electron version <input id="electronVersion"></label>
  <label>Chrome version <input id="chromeVersion"></label>
  <label>Display server <select id="display"><option>wayland</option><option>x11</option><option selected>unknown</option></select></label>
  <label>Ozone platform <input id="ozone" placeholder="wayland"></label>
  <label>Sandbox flags <input id="sandbox" placeholder="--disable-gpu-sandbox"></label>
  <label>VA environment <input id="vaEnv" placeholder="DRIVER_NAME=v4l2;V4L2_VIDEO_PATH=/dev/videoX"></label>
  <label>Resolved Iris node <input id="node" placeholder="/dev/videoX"></label>
  <label>Source commit <input id="commit" placeholder="full git object id"></label>
  <label>Driver SHA-256 <input id="driverHash" placeholder="64 hex characters"></label>
  <label>Boot ID <input id="bootId" placeholder="boot id before/after playback"></label>
</div>

<video id="video" controls muted playsinline preload="auto" width="960"></video>
<p>
  <button id="start">Start bounded run</button>
  <button id="capture" disabled>Capture JSON report</button>
  <a id="download" hidden download="iris-electron-video-report.json">Download report</a>
</p>
<div id="metrics" aria-live="polite"></div>
<pre id="result"></pre>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video');
  const query = new URLSearchParams(location.search);
  if (query.get('src')) $('src').value = query.get('src');
  for (const id of ['app', 'appVersion', 'electronVersion', 'chromeVersion', 'display', 'ozone', 'sandbox', 'vaEnv', 'node', 'commit', 'driverHash', 'bootId', 'decoder', 'platform']) {
    if (query.get(id)) $(id).value = query.get(id);
  }
  const started = new Date().toISOString();
  let frameCallbacks = 0;
  let timer = 0;
  let running = false;
  function versions() {
    const ua = navigator.userAgent;
    const electron = ua.match(/Electron\/([^ )]+)/)?.[1] || $('electronVersion').value || 'unknown';
    const chrome = ua.match(/Chrome\/([^ )]+)/)?.[1] || $('chromeVersion').value || 'unknown';
    return { user_agent: ua, electron_version: electron, chrome_version: chrome };
  }
  function quality() {
    const q = video.getVideoPlaybackQuality?.();
    return { decoded_frames: q?.totalVideoFrames ?? null, dropped_frames: q?.droppedVideoFrames ?? null,
      presented_callback_frames: frameCallbacks, quality_api: Boolean(q) };
  }
  function render() {
    const q = quality();
    $('metrics').textContent = `readyState=${video.readyState} time=${video.currentTime.toFixed(2)}s ` +
      `decoded=${q.decoded_frames ?? 'unknown'} dropped=${q.dropped_frames ?? 'unknown'} rVFC=${q.presented_callback_frames}`;
  }
  function frame() {
    frameCallbacks++;
    render();
    if (running && video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame);
  }
  function start() {
    clearTimeout(timer);
    running = true;
    frameCallbacks = 0;
    video.src = $('src').value;
    video.load();
    video.play().catch(error => { $('result').textContent = `play() failed: ${error.message}`; });
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame);
    timer = setTimeout(() => { running = false; $('capture').disabled = false; render(); }, Number(query.get('duration_ms') || 10000));
    $('result').textContent = 'Run active; keep this window foregrounded. Capture after the bounded run finishes.';
    $('start').disabled = true;
  }
  function report() {
    const v = versions();
    const q = quality();
    const platform = $('platform').value === 'unknown' ? null : $('platform').value === 'true';
    return { schema_version: 1, captured_at_utc: new Date().toISOString(), started_at_utc: started,
      result: $('decoder').value === 'VaapiVideoDecoder' && platform === true && (q.decoded_frames ?? 0) > 0 ? 'pass' : 'unqualified',
      runtime: { application: $('app').value || 'unknown', application_version: $('appVersion').value || 'unknown',
        electron_version: $('electronVersion').value || v.electron_version, chrome_version: $('chromeVersion').value || v.chrome_version,
        user_agent: v.user_agent },
      display: { server: $('display').value, ozone_platform: $('ozone').value || 'unknown' },
      launch: { sandbox_flags: $('sandbox').value.split(/\s+/).filter(Boolean), va_environment: $('vaEnv').value || 'unknown' },
      target: { resolved_iris_node: $('node').value || 'unknown', boot_id: $('bootId').value || 'unknown',
        source_commit: $('commit').value || 'unknown', driver_sha256: $('driverHash').value || 'unknown' },
      media: { source: $('src').value, width: video.videoWidth, height: video.videoHeight, duration_seconds: video.duration,
        decoder_name: $('decoder').value || 'unknown', is_platform_video_decoder: platform, ...q },
      limitations: ['Decoder name and kIsPlatformVideoDecoder are manually transcribed from media-internals.',
        'Page counters are Chromium playback-quality counters, not an Iris trace.',
        'A pass requires a real media surface; GPU-process or libva loading alone is insufficient.'] };
  }
  $('start').addEventListener('click', start);
  $('capture').addEventListener('click', () => {
    const json = JSON.stringify(report(), null, 2);
    $('result').textContent = json;
    const blob = new Blob([json], { type: 'application/json' });
    $('download').href = URL.createObjectURL(blob);
    $('download').hidden = false;
  });
  video.addEventListener('timeupdate', render);
  video.addEventListener('loadedmetadata', render);
})();
</script>
