<!doctype html>
<meta charset="utf-8">
<title>Iris ending probe</title>
<video id="v" controls muted playsinline preload="auto" width="960"></video>
<script>
const video = document.getElementById('v');
const source = new URLSearchParams(location.search).get('src') || '../Big_Buck_Bunny_1080p_30sec.mp4';
video.src = source;
window.__irisEndingProbe = { events: [], frames: [], started: performance.now() };
const probe = window.__irisEndingProbe;
const snapshot = name => () => probe.events.push({
  name,
  wall: +((performance.now() - probe.started) / 1000).toFixed(6),
  time: +video.currentTime.toFixed(6),
  ended: video.ended,
  paused: video.paused,
  readyState: video.readyState,
});
for (const name of ['loadstart', 'loadedmetadata', 'canplay', 'playing', 'pause', 'ended', 'waiting', 'stalled', 'error'])
  video.addEventListener(name, snapshot(name));
video.addEventListener('timeupdate', snapshot('timeupdate'));
function frame(now, metadata) {
  probe.frames.push({
    wall: +((performance.now() - probe.started) / 1000).toFixed(6),
    time: +(metadata.mediaTime ?? video.currentTime).toFixed(6),
    presented: metadata.presentedFrames,
  });
  if (!video.ended)
    video.requestVideoFrameCallback(frame);
}
video.addEventListener('loadedmetadata', () => {
  if (video.requestVideoFrameCallback)
    video.requestVideoFrameCallback(frame);
});
window.startIrisEndingProbe = async () => {
  await video.play();
  return { duration: video.duration, currentTime: video.currentTime, readyState: video.readyState };
};
</script>
